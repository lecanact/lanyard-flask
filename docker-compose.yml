services:
  lanyard_redis:
    image: redis:latest
    container_name: lanyard_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  lanyard_flask:
    build: .
    container_name: lanyard_flask
    restart: always
    depends_on:
      - redis
    ports:
      - "4001:4001"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      HTTP_PORT: 4001
      FLASK_ENV: production
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      USER_TOKEN: ${USER_TOKEN}
    volumes:
      - .:/app

volumes:
  redis_data:
