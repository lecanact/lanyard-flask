services:
  redis:
    image: redis:7-alpine
    container_name: lanyard_redis
    restart: always
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  lanyard:
    build: .
    container_name: lanyard
    restart: always
    depends_on:
      - redis
    ports:
      - "4001:4001"
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      HTTP_PORT: 4001
      FLASK_ENV: production
      PYTHONDONTWRITEBYTECODE: 1
    volumes:
      - .:/app

volumes:
  redis_data:
